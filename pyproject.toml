[project]
name = "baka-blog"
version = "1.31.1"
description = "A local-first cute personal website built with Flask."
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "wheelhouse", "instance", "docs/phase-2/prototype", "bakagit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
