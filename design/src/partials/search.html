<dialog class="dialog dialog--search" id="search" aria-label="搜索">
  <div class="searchbox">
    <div class="searchbox__top">
      <svg class="i"><use href="#i-search"/></svg>
      <input class="input" type="search" placeholder="搜文章、动态、页面……" aria-label="搜索关键词" autocomplete="off">
      <kbd>Esc</kbd>
    </div>
    <div class="searchbox__list" role="listbox" aria-label="搜索结果"></div>
    <div class="searchbox__foot"><span>↑ ↓ 选择　↵ 打开</span><span>按 / 随时呼出</span></div>
  </div>
</dialog>
