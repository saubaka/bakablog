{% from "components/macros.html" import icon %}
<header class="site-header is-nav-arriving" data-capsule-nav>
  <nav class="site-nav" aria-label="主导航">
    <a class="site-brand" href="{{ url_for('public.home') }}"><span class="brand-mark">{% if site_logo %}<img src="{{ url_for('public.media_file', filename=site_logo.thumbnail_filename) }}" alt="">{% else %}<span class="window-symbol" aria-hidden="true"><i></i><i></i></span>{% endif %}</span><span>{{ site_name }}</span></a>
    <div class="site-nav__links">
      {% for item in primary_navigation %}<a class="{% if request.endpoint == item.endpoint or (item.target == 'blog' and request.endpoint == 'public.article') or (item.target == 'projects' and request.endpoint == 'public.project_detail') or (item.target == 'moments' and request.endpoint == 'public.moment_detail') or (item.target == 'gallery' and request.endpoint == 'public.album_detail') %}is-current{% endif %}" href="{{ item.url }}" {% if item.open_new_tab %}target="_blank" rel="noopener"{% endif %}>{{ item.label }}</a>{% endfor %}
    </div>
    <div class="site-nav__actions">
      <a class="icon-button{% if request.endpoint == 'public.search' %} is-current{% endif %}" href="{{ url_for('public.search') }}" aria-label="全站搜索">{{ icon('search') }}</a>
      <button class="icon-button mobile-menu-button" type="button" data-mobile-drawer aria-controls="mobile-drawer" aria-expanded="false" aria-label="打开更多菜单">{{ icon('menu') }}</button>
    </div>
  </nav>
</header>
