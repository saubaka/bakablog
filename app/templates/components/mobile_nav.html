{% from "components/macros.html" import icon %}
{% set mobile_direct_endpoints = ('public.home', 'public.blog', 'public.article', 'public.moments', 'public.moment_detail', 'public.links') %}
<nav class="mobile-bottom-nav is-mobile-nav-arriving" aria-label="移动端导航" data-mobile-capsule-nav>
  <a class="{% if request.endpoint == 'public.home' %}is-current{% endif %}" href="{{ url_for('public.home') }}"{% if request.endpoint == 'public.home' %} aria-current="page"{% endif %}>{{ icon('home') }}<small>首页</small></a>
  <a class="{% if request.endpoint in ('public.blog', 'public.article') %}is-current{% endif %}" href="{{ url_for('public.blog') }}"{% if request.endpoint in ('public.blog', 'public.article') %} aria-current="page"{% endif %}>{{ icon('document') }}<small>博客</small></a>
  <a class="{% if request.endpoint in ('public.moments','public.moment_detail') %}is-current{% endif %}" href="{{ url_for('public.moments') }}"{% if request.endpoint in ('public.moments','public.moment_detail') %} aria-current="page"{% endif %}>{{ icon('moment') }}<small>动态</small></a>
  <a class="{% if request.endpoint == 'public.links' %}is-current{% endif %}" href="{{ url_for('public.links') }}"{% if request.endpoint == 'public.links' %} aria-current="page"{% endif %}>{{ icon('link') }}<small>友链</small></a>
  <button class="{% if request.endpoint not in mobile_direct_endpoints %}is-current{% endif %}" type="button" data-mobile-drawer aria-controls="mobile-drawer" aria-expanded="false"{% if request.endpoint not in mobile_direct_endpoints %} aria-current="page"{% endif %}>{{ icon('menu') }}<small>更多</small></button>
</nav>
