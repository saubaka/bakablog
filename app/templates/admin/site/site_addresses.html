{% extends "layouts/admin.html" %}{% block title %}网站链接 · {{ site_name }}{% endblock %}{% block admin_title %}网站链接{% endblock %}{% block admin_actions %}{% endblock %}
{% block admin_content %}<div class="site-address-workspace"><section class="card site-address-card"><span class="eyebrow">CURRENT HOST</span><h2>{{ current_host }}</h2><p>保存后，未列出的域名或IP将直接拒绝访问。</p></section><form class="card admin-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field"><span>绑定网站网址</span><textarea name="bound_urls" rows="10" placeholder="http://127.0.0.1:5000&#10;https://example.com">{% for url in policy.bound_urls %}{{ url }}{{ '\n' if not loop.last }}{% endfor %}</textarea></label><button class="button button--primary is-save-action">保存网站链接</button></form></div>{% endblock %}
