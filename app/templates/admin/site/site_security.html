{% extends "layouts/admin.html" %}{% block title %}安全 · {{ site_name }}{% endblock %}{% block admin_title %}安全{% endblock %}{% block admin_actions %}{% endblock %}
{% block admin_content %}<form class="site-security-grid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="card security-setting-card"><input type="checkbox" name="require_https" value="y" {{ 'checked' if policy.require_https }}><span class="security-setting-card__switch"></span><span><strong>强制HTTPS</strong><small>把HTTP请求永久重定向到HTTPS，并发送HSTS与升级资源策略。</small></span></label><label class="card security-setting-card"><input type="checkbox" name="hotlink_protection" value="y" {{ 'checked' if policy.hotlink_protection }}><span class="security-setting-card__switch"></span><span><strong>本地媒体防盗链</strong><small>拒绝从未绑定域名引用媒体库原图和缩略图，直接访问仍然允许。</small></span></label><section class="card admin-section admin-login-security"><div class="section-heading"><div><span class="eyebrow">SUPERADMIN ACCESS</span><h2>超级管理员入口</h2></div><span class="status-pill status-pill--approved">人机验证已启用</span></div><p><code>/bakaadmin</code> 是唯一登录入口，连续输错密码会暂时限制同一访问来源。</p><div class="form-grid"><label class="field"><span class="field__label">允许的密码错误次数</span><input type="number" name="admin_login_max_failures" min="3" max="20" value="{{ login_max_failures }}" required></label><label class="field"><span class="field__label">限制时长（分钟）</span><input type="number" name="admin_login_lock_minutes" min="1" max="180" value="{{ login_lock_minutes }}" required></label></div></section><label class="card security-confirm-card"><input type="checkbox" name="confirm_https" value="y"><span><strong>HTTPS已经可以访问</strong><small>只有从HTTP首次开启强制HTTPS时需要确认。</small></span></label><footer class="card sticky-form-actions"><button class="button button--primary">保存安全设置</button></footer></form>{% endblock %}
